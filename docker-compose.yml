# ─────────────────────────────────────────────────────────────────────────────
# second-brain / docker-compose.yml
# Phase 1+2 stack: API + Celery Worker + Redis + Neo4j + Qdrant
#
# USAGE:
#   docker compose up --build        ← start everything
#   docker compose up --build -d     ← start in background
#   docker compose logs -f api       ← follow API logs
#   docker compose logs -f worker    ← follow worker logs
#   docker compose down              ← stop everything
#   docker compose down -v           ← stop + delete volumes (wipes storage!)
#
# SERVICES:
#   redis   — message broker for the task queue
#   api     — FastAPI server (port 8000)
#   worker  — Celery worker, processes OCR / transcription / Phase 2 pipeline
#   neo4j   — graph database for knowledge graph (port 7474/7687)
#   qdrant  — vector database for embeddings (port 6333)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: brain_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Neo4j (Phase 2 — Knowledge Graph) ──────────────────────────────────────
  neo4j:
    image: neo4j:5
    container_name: brain_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"    # HTTP browser
      - "7687:7687"    # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/secondbrain
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant (Phase 2 — Vector Store) ────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant
    container_name: brain_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"    # REST API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI (Ingestion + Search API) ────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: brain_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_PATH=/app/storage/uploads
      - WATCH_FOLDER=/app/watched_inbox
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=secondbrain
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./storage:/app/storage          # persist captured files
      - ./watched_inbox:/app/watched_inbox
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Celery Worker ─────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: brain_worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_PATH=/app/storage/uploads
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=secondbrain
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A task_queue.tasks worker --loglevel=info --concurrency=2

  # ── Celery Beat (Phase 2 — nightly GraphRAG scheduler) ─────────────────────
  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: brain_beat
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_PATH=/app/storage/uploads
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=secondbrain
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./storage:/app/storage
    depends_on:
      - redis
      - worker
    command: celery -A task_queue.tasks beat --loglevel=info
    profiles:
      - scheduler    # only starts with: docker compose --profile scheduler up

  # ── Flower (Celery dashboard — optional but useful) ────────────────────────
  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: brain_flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - worker
    command: celery -A task_queue.tasks flower --port=5555
    profiles:
      - monitoring   # only starts with: docker compose --profile monitoring up

  # ── Frontend (Phase 3 — React Graph UI) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: brain_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api

volumes:
  redis_data:
  neo4j_data:
  qdrant_data:

